[project]
name = "moneta"
version = "0.1.0"
description = "MONETA: Multimodal Industry Classification through Geographic Information with Multi Agent Systems (ACL 2026)"
readme = "README.md"
license = "MIT"
requires-python = "~=3.13.0"
dependencies = [
    "loguru>=0.7.3",
    "pandas==2.3.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn==1.8.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
open = [
    "accelerate==1.12.0",
    "einops>=0.8.2",
    "qwen-vl-utils==0.0.14",
    "timm==1.0.22",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.3",
]
data = [
    "beautifulsoup4>=4.15.0",
    "mercantile>=1.2.1",
    "openpyxl>=3.1.5",
    "osmium>=4.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moneta"]

[tool.ruff]
line-length = 88
exclude = [".venv/", ".cache/", "static/", "plots/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# UP042: keep (str, Enum); StrEnum changes f-string formatting of enum members used in prompts
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["moneta"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
